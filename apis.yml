aid: ejari-co
name: Ejari Co.
description: >-
  Ejari (ايجاري) is a Riyadh-based property-technology and fintech company transforming
  the rental market in Saudi Arabia with a rent-now, pay-later (RNPL) model. Ejari pays a
  tenant's full annual rent to the landlord up front, then lets the tenant repay in twelve
  calm monthly installments, replacing the Kingdom's traditional single-cheque annual rent
  requirement. Founded in 2022 by Yazeed Al-Shamsi, Fahad Albedah, Mohammed Alkhelewy and
  Khalid Almunif, the company operates across 17+ Saudi cities and is building toward a
  full-service, Sharia-compliant real-estate super app. Ejari is backed by 500 Global and
  won the 2024 KPMG Global Tech Innovator competition.
